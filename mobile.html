<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>P2P Mobil Alıcı</title>
<link rel="manifest" href="manifest.json">
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
  :root { --bg:#0b1220; --surface:#151d2f; --border:#2a3448; --text:#e7ecf5; --muted:#8f9bb3; --accent:#4ade80; --blue:#60a5fa; --danger:#f87171; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:sans-serif; display:flex; flex-direction:column; height:100dvh; overflow:hidden; text-align:center; }
  header { padding:15px; background:#16213a; border-bottom:1px solid var(--border); font-weight:bold; }
  
  .container { flex:1; display:flex; flex-direction:column; padding:20px; justify-content:center; align-items:center; }
  
  #videoContainer { position:relative; width:100%; max-width:350px; aspect-ratio:1/1; border-radius:12px; overflow:hidden; border:2px solid var(--border); margin-bottom:20px; }
  video { width:100%; height:100%; object-fit:cover; }
  .scan-overlay { position:absolute; inset:15%; border:2px solid var(--accent); border-radius:10px; box-shadow:0 0 0 9999px rgba(0,0,0,0.6); }
  
  .instruction { font-size:18px; font-weight:bold; color:var(--blue); margin-bottom:10px; }
  .status-box { padding:15px; border-radius:10px; background:var(--surface); border:1px solid var(--border); font-size:15px; width:100%; max-width:300px; margin-bottom:20px; }
  .status-box.success { border-color:var(--accent); color:var(--accent); }
  
  .btn-restart { display:none; padding:12px 20px; background:var(--accent); color:#000; border:none; border-radius:8px; font-weight:bold; cursor:pointer; }
  
  .download-area { width:100%; max-width:300px; margin-top:20px; }
  .progress-bar { width:100%; height:8px; background:var(--border); border-radius:4px; margin-top:10px; overflow:hidden; display:none; }
  .progress-bar div { height:100%; background:var(--accent); width:0%; transition:width 0.2s; }
</style>
</head>
<body>

<header>📱 Mobil Alıcı</header>

<div class="container">
  <div class="instruction" id="mainInstruction">Hocanın QR Kodunu Okutun</div>
  <div id="videoContainer">
    <video id="video" playsinline autoplay muted></video>
    <div class="scan-overlay"></div>
  </div>
  
  <div class="status-box" id="statusBox">Kamera Başlatılıyor...</div>
  
  <div class="download-area" id="downloadAreaMobile"></div>
  <div class="progress-bar" id="mobileProgress"><div id="mobileProgressFill"></div></div>
  
  <button class="btn-restart" id="btnRestart" onclick="location.reload()">Yeniden Başlat</button>
</div>

<script>
let peer = null;
let scannerActive = true;
let activeConn = null;

async function initScanner() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const video = document.getElementById('video');
    video.srcObject = stream;
    video.setAttribute('playsinline', true);
    video.play();
    requestAnimationFrame(tick);
    document.getElementById('statusBox').innerText = "QR Kod Aranıyor...";
  } catch (err) {
    document.getElementById('statusBox').innerText = "Kamera Hatası: " + err.message;
    document.getElementById('statusBox').style.color = "var(--danger)";
  }
}

function tick() {
  if (!scannerActive) return;
  const video = document.getElementById('video');
  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height);
    if (code) {
      handleScannedCode(code.data);
      return;
    }
  }
  requestAnimationFrame(tick);
}

function handleScannedCode(id) {
  scannerActive = false;
  const video = document.getElementById('video');
  if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
  document.getElementById('videoContainer').style.display = 'none';
  
  document.getElementById('mainInstruction').innerText = "Bağlanılıyor...";
  document.getElementById('statusBox').innerText = "Hocaya bağlanılıyor, dosya bekleniyor...";
  
  peer = new Peer();
  peer.on('open', () => {
    const conn = peer.connect(id);
    activeConn = conn;
    
    conn.on('open', () => {
      document.getElementById('mainInstruction').innerText = "Bağlantı Kuruldu!";
      document.getElementById('statusBox').className = "status-box success";
      document.getElementById('statusBox').innerText = "Dosya transferi başlıyor...";
    });

    conn.on('data', (data) => handleIncomingDataMobile(data));
  });
}

let incomingFile = null;
let receivedChunks = [];

function handleIncomingDataMobile(data) {
  if (data.type === 'file-start') {
    incomingFile = { name: data.name, size: data.size, mime: data.mime, chunks: data.chunks };
    receivedChunks = [];
    document.getElementById('mobileProgress').style.display = 'block';
    document.getElementById('downloadAreaMobile').innerHTML = `<p>Alınıyor: ${data.name}</p>`;
  } 
  else if (data.type === 'file-chunk') {
    receivedChunks.push(data.data);
    let percent = Math.round((receivedChunks.length / incomingFile.chunks) * 100);
    document.getElementById('mobileProgressFill').style.width = percent + '%';

    if (receivedChunks.length === incomingFile.chunks) {
      const blob = new Blob(receivedChunks, { type: incomingFile.mime });
      const url = URL.createObjectURL(blob);
      
      let html = `<h3 style="color:var(--accent);">Transfer Başarılı!</h3>`;
      if (incomingFile.mime && incomingFile.mime.startsWith('image/')) {
        html += `<img src="${url}" style="max-width:100%; border-radius:8px; margin-bottom:10px;"><br>`;
      }
      html += `<a href="${url}" download="${incomingFile.name}" style="display:block; padding:12px; background:var(--blue); color:#000; text-decoration:none; border-radius:8px; font-weight:bold; margin-bottom:10px;">Dosyayı İndir</a>`;
      
      document.getElementById('downloadAreaMobile').innerHTML = html;
      document.getElementById('mobileProgress').style.display = 'none';
      document.getElementById('statusBox').innerText = "Transfer Tamamlandı.";
      document.getElementById('btnRestart').style.display = 'inline-block';
    }
  }
}

initScanner();
</script>
</body>
</html>
